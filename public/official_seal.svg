<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="sealTextPathTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
    <path id="sealTextPathBottom" d="M 170,100 A 70,70 0 1,1 30,100" fill="none" />
  </defs>
  <!-- Outer Double Serrated / Circular Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#1a3a6b" stroke-width="4" stroke-dasharray="4,2" opacity="0.9" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1a3a6b" stroke-width="2.5" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="#1a3a6b" stroke-width="1.8" />
  
  <!-- Top Circular Text -->
  <text fill="#1a3a6b" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="2.5">
    <textPath href="#sealTextPathTop" startOffset="50%" text-anchor="middle">
      ★ LETSCOD TECHNOLOGIES ★
    </textPath>
  </text>

  <!-- Bottom Circular Text -->
  <text fill="#1a3a6b" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">
    <textPath href="#sealTextPathBottom" startOffset="50%" text-anchor="middle">
      GOVT. RECOGNIZED • ISO 9001
    </textPath>
  </text>

  <!-- Inner Center Shield / Star Crest -->
  <circle cx="100" cy="100" r="48" fill="#1a3a6b" fill-opacity="0.06" stroke="#1a3a6b" stroke-width="1.2" />
  
  <g fill="#1a3a6b" transform="translate(100, 78) scale(0.75)">
    <!-- 5-Point Star -->
    <polygon points="0,-16 5,-4 17,-4 8,4 11,16 0,8 -11,16 -8,4 -17,-4 -5,-4" />
  </g>

  <text x="100" y="105" text-anchor="middle" fill="#1a3a6b" font-family="Arial, sans-serif" font-size="10.5" font-weight="900" letter-spacing="1">
    OFFICIAL
  </text>
  <text x="100" y="118" text-anchor="middle" fill="#1a3a6b" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">
    SEAL
  </text>
  <text x="100" y="130" text-anchor="middle" fill="#1a3a6b" font-family="Arial, sans-serif" font-size="7" font-weight="700" letter-spacing="0.8">
    VALIDATED
  </text>
</svg>
